<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JLT Pro Service – připravujeme</title>
  <meta name="description" content="Nový web JLT Pro Service pro vás právě připravujeme.">
  <meta name="theme-color" content="#fafaf8">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fafaf8;
      color: #1c1c1c;
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    .brand {
      margin: 0 0 20px;
      font-size: 13px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #777;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 56px);
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .contact {
      margin: 40px 0 0;
      font-size: 16px;
      line-height: 1.8;
      color: #555;
    }

    .contact a {
      color: #1c1c1c;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
    }

    .contact a:hover { border-bottom-color: #1c1c1c; }
  </style>
</head>
<body>
  <main>
    <p class="brand">JLT Pro Service</p>
    <h1>Připravujeme…</h1>
    <p class="contact">
      Kontakt<br>
      <a href="mailto:jitka.urbanova@jltproservice.cz">jitka.urbanova@jltproservice.cz</a><br>
      <a href="tel:+420724826601">+420 724 826 601</a>
    </p>
  </main>
</body>
</html>
