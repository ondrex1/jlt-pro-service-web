<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JLT Pro Service – připravujeme</title>
  <meta name="description" content="Nový web JLT Pro Service pro vás právě připravujeme.">
  <meta name="theme-color" content="#101418">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101418'/%3E%3Cpath d='M9 22h14' stroke='%23f2a900' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #101418;
      --fg: #f3f1ec;
      --muted: #8d949c;
      --accent: #f2a900;
      --line: rgba(243, 241, 236, .14);
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(20px, 4vw, 48px);
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 64px 64px;
      background-position: center;
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand {
      color: var(--fg);
      font-weight: 700;
    }

    .brand span { color: var(--accent); }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 900px;
      padding: 48px 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 11vw, 132px);
      line-height: .95;
      font-weight: 800;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    .dots span {
      color: var(--accent);
      animation: blink 1.4s infinite both;
    }

    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }

    p {
      margin: 28px 0 0;
      max-width: 34em;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.55;
      color: var(--muted);
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: .15; }
      40% { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .35; transform: scale(.7); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dots span, .status::before { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">JLT <span>Pro</span> Service</div>
    <div>Web ve výstavbě</div>
  </header>

  <main>
    <div class="status">Pracujeme na tom</div>
    <h1>Připravujeme<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
    <p>Nový web JLT Pro Service je na cestě. Zastavte se prosím brzy znovu.</p>
  </main>

  <footer>
    <div>&copy; <span id="year">2026</span> JLT Pro Service</div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
